<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GROWING A TREE — Hand Grow</title>
<style>
  :root{
    --paper:#f5f4ee;
    --ink:#111;
    --muted:#6f6f68;
    --panel:rgba(245,244,238,.90);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink)}
  body{
    font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    overflow:hidden;
  }
  #app{position:relative;width:100%;height:100dvh;min-height:520px}
  #tree{position:absolute;inset:0;width:100%;height:100%;display:block}
  #camera{
    position:absolute;right:22px;top:22px;
    width:min(260px,30vw);aspect-ratio:4/3;
    object-fit:cover;transform:scaleX(-1);
    opacity:.42;filter:none;
    border:1px solid rgba(17,17,17,.18);
    z-index:1;background:#ddd;
  }
  #handOverlay{
    position:absolute;right:22px;top:22px;
    width:min(260px,30vw);aspect-ratio:4/3;
    z-index:2;pointer-events:none;
  }
  header{position:absolute;z-index:3;top:22px;left:28px;pointer-events:none}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.12em}
  header p{margin:5px 0 0;font-size:10px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}
  .panel{
    position:absolute;z-index:4;left:28px;bottom:26px;
    width:min(340px,calc(100vw - 56px));
    padding:16px 17px 15px;background:var(--panel);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid rgba(17,17,17,.14)
  }
  .rule{display:grid;grid-template-columns:82px 1fr 50px;align-items:center;gap:10px;min-height:31px}
  .rule label{font-size:10px;letter-spacing:.08em}
  .rule output{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;color:#333}
  input[type=range]{width:100%;height:18px;margin:0;background:transparent;appearance:none;-webkit-appearance:none}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:#555}
  input[type=range]::-webkit-slider-thumb{
    appearance:none;-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;
    background:#111;border:0;border-radius:50%
  }
  .branch-fixed{height:18px;display:flex;align-items:center;font-size:10px;letter-spacing:.08em}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
  button{
    border:1px solid #111;background:transparent;color:#111;height:35px;
    font:600 10px/1 Arial,sans-serif;letter-spacing:.12em;cursor:pointer
  }
  button.primary{background:#111;color:var(--paper)}
  button:hover{background:#111;color:var(--paper)}
  .status{
    position:absolute;z-index:4;right:28px;bottom:28px;
    text-align:right;font-size:10px;line-height:1.8;letter-spacing:.08em;color:var(--muted);
    font-variant-numeric:tabular-nums
  }
  #pinchIndicator{
    position:absolute;z-index:5;right:32px;top:30px;
    width:12px;height:12px;border-radius:50%;
    border:1px solid #111;background:transparent;pointer-events:none;
    transition:transform .08s ease, background .08s ease;
  }
  #pinchIndicator.on{background:#111;transform:scale(1.45)}
  .message{
    position:absolute;z-index:4;left:50%;top:12%;
    transform:translateX(-50%);font-size:11px;letter-spacing:.12em;
    color:#333;text-align:center;pointer-events:none;white-space:nowrap;
  }
  @media (max-width:700px){
    header{top:18px;left:18px}
    #camera,#handOverlay{right:14px;top:68px;width:140px}
    #pinchIndicator{right:22px;top:76px}
    .panel{left:18px;bottom:18px;width:calc(100vw - 36px)}
    .status{right:18px;bottom:252px}
    .message{top:18%;font-size:9px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="tree"></canvas>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="handOverlay"></canvas>
  <div id="pinchIndicator"></div>

  <header>
    <h1>GROWING A TREE</h1>
    <p>rule / variation / hand grow</p>
  </header>

  <div class="message" id="message">CAMERA START → PINCH TO CREATE THE FIRST TRUNK</div>

  <section class="panel">
    <div class="rule">
      <label>BRANCH</label><div class="branch-fixed">2 / 3 RANDOM</div><output>random</output>
    </div>
    <div class="rule">
      <label for="angle">ANGLE</label><input id="angle" type="range" min="5" max="55" value="25"><output id="angleOut">25°</output>
    </div>
    <div class="rule">
      <label for="length">LENGTH</label><input id="length" type="range" min="50" max="88" value="72"><output id="lengthOut">72%</output>
    </div>
    <div class="rule">
      <label for="width">WIDTH</label><input id="width" type="range" min="45" max="82" value="62"><output id="widthOut">62%</output>
    </div>
    <div class="rule">
      <label for="variation">VARIATION</label><input id="variation" type="range" min="0" max="30" value="8"><output id="variationOut">8%</output>
    </div>
    <div class="buttons">
      <button id="cameraStart" class="primary">CAMERA START</button>
      <button id="reset">RESET</button>
    </div>
  </section>

  <div class="status">
    <div id="generationStatus">GENERATION —</div>
    <div id="handStatus">HAND: OFF</div>
    <div id="windStatus">WIND: OFF</div>
  </div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";

const canvas = document.getElementById('tree');
const ctx = canvas.getContext('2d');
const video = document.getElementById('camera');
const overlay = document.getElementById('handOverlay');
const octx = overlay.getContext('2d');

const cameraStart = document.getElementById('cameraStart');
const resetBtn = document.getElementById('reset');
const message = document.getElementById('message');
const genStatus = document.getElementById('generationStatus');
const handStatus = document.getElementById('handStatus');
const windStatus = document.getElementById('windStatus');
const pinchIndicator = document.getElementById('pinchIndicator');

const controls = {
  angle: document.getElementById('angle'),
  length: document.getElementById('length'),
  width: document.getElementById('width'),
  variation: document.getElementById('variation')
};
const outputs = {
  angle: document.getElementById('angleOut'),
  length: document.getElementById('lengthOut'),
  width: document.getElementById('widthOut'),
  variation: document.getElementById('variationOut')
};

let cssW=0, cssH=0, dpr=1;
let generation = -1; // -1: nothing, 0: trunk, 1+: grow
const maxGeneration = 10;
let seed = Math.random()*100000;

let handLandmarker = null;
let cameraRunning = false;
let lastVideoTime = -1;
let previousPinch = false;
let lastPinchTime = 0;

let windActive = false;
let windStrength = 0;
let targetWindStrength = 0;
let windPhase = 0;
let lastFrameTime = performance.now();
let leftOpenHoldStart = 0;
const LEFT_OPEN_HOLD_MS = 280;

// Pinch hysteresis: close threshold turns ON, wider threshold turns OFF.
// Distance is normalized by wrist-to-middle-MCP hand size.
const PINCH_ON = 0.34;
const PINCH_OFF = 0.46;
const PINCH_COOLDOWN_MS = 420;

function random01(i){
  const x = Math.sin(seed + i*12.9898)*43758.5453123;
  return x-Math.floor(x);
}
function signedRandom(i){return random01(i)*2-1}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}

function handOpenness(lm){
  const wrist=lm[0];
  const palmScale=Math.max(.001,dist(lm[0],lm[9]));
  const tips=[4,8,12,16,20];
  const bases=[2,5,9,13,17];
  let score=0;
  for(let i=0;i<tips.length;i++){
    const tipDist=dist(wrist,lm[tips[i]])/palmScale;
    const baseDist=dist(wrist,lm[bases[i]])/palmScale;
    const extension=tipDist-baseDist;
    score += clamp((extension-.15)/.65,0,1);
  }
  return score/tips.length;
}

function handednessLabel(results,i){
  const cat=results.handednesses?.[i]?.[0];
  return cat?.categoryName || cat?.displayName || '';
}

function params(){
  return {
    angle:Number(controls.angle.value)*Math.PI/180,
    lenRatio:Number(controls.length.value)/100,
    widthRatio:Number(controls.width.value)/100,
    variation:Number(controls.variation.value)/100
  };
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  cssW=r.width; cssH=r.height;
  canvas.width=Math.round(cssW*dpr);
  canvas.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const or=overlay.getBoundingClientRect();
  overlay.width=Math.max(1,Math.round(or.width*dpr));
  overlay.height=Math.max(1,Math.round(or.height*dpr));
  octx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function drawGround(){
  const y=cssH-Math.max(26,cssH*.045);
  ctx.beginPath();ctx.moveTo(0,y);
  for(let x=0;x<=cssW+16;x+=16){
    ctx.lineTo(x,y+Math.sin(x*.019+seed)*.7);
  }
  ctx.lineWidth=.8;ctx.strokeStyle='#555';ctx.stroke();
  return y;
}

function drawBranch(x,y,len,angle,width,depth,index,p,sway=0){
  if(depth<=0||len<1.4||width<.18)return;
  const angleJitter=signedRandom(index*5+1)*p.variation*.45;
  const lengthJitter=1+signedRandom(index*5+2)*p.variation*.32;
  const depthFactor=1-Math.min(1,width/26);
  const gust=Math.sin(windPhase+index*.37)*.24+.76;
  const windBend=sway*depthFactor*gust;
  const localAngle=angle+angleJitter+windBend;
  const localLen=len*lengthJitter;
  const x2=x+Math.cos(localAngle)*localLen;
  const y2=y+Math.sin(localAngle)*localLen;

  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);
  ctx.lineWidth=Math.max(.5,width);ctx.lineCap='round';ctx.strokeStyle='#111';ctx.stroke();

  if(depth===1)return;

  // Each node deterministically chooses 2 or 3 children from the current tree seed.
  // RESET changes the seed, creating a new branching pattern.
  const childCount = random01(index * 11 + 7) < 0.5 ? 2 : 3;

  if(childCount === 2){
    const asym=signedRandom(index*5+3)*p.variation*.16;
    const leftLen=localLen*p.lenRatio*(1+asym);
    const rightLen=localLen*p.lenRatio*(1-asym);
    const jl=signedRandom(index*5+4)*p.variation*.40;
    const jr=signedRandom(index*5+5)*p.variation*.40;

    drawBranch(
      x2,y2,leftLen,
      localAngle-p.angle*(1+jl),
      width*p.widthRatio,depth-1,index*3+1,p,sway
    );
    drawBranch(
      x2,y2,rightLen,
      localAngle+p.angle*(1+jr),
      width*p.widthRatio,depth-1,index*3+2,p,sway
    );
  }else{
    // Three-way split: left, center, right.
    const offsets=[-1,0,1];
    offsets.forEach((side,k)=>{
      const lenVar=1+signedRandom(index*13+k+1)*p.variation*.18;
      const splitVar=signedRandom(index*17+k+1)*p.variation*.32;
      const centerWander = side===0
        ? signedRandom(index*19+3)*p.variation*.18
        : 0;
      const childAngle =
        localAngle +
        side*p.angle*(1+splitVar) +
        centerWander;

      drawBranch(
        x2,y2,
        localLen*p.lenRatio*lenVar,
        childAngle,
        width*p.widthRatio,
        depth-1,
        index*3+k+1,
        p,
        sway
      );
    });
  }
}

function draw(){
  ctx.clearRect(0,0,cssW,cssH);
  ctx.fillStyle='#f5f4ee';ctx.fillRect(0,0,cssW,cssH);
  const groundY=drawGround();

  if(generation<0){
    genStatus.textContent='GENERATION —';
    return;
  }
  genStatus.textContent=`GENERATION ${generation} / ${maxGeneration}`;

  const p=params();
  const depth=generation+1;
  const available=Math.min(cssH*.67,cssW*.42);
  const trunkLen=Math.max(90,Math.min(210,available*.46));
  const trunkWidth=Math.max(11,Math.min(25,cssW*.022));
  const sway=windActive ? windStrength*.34 : 0;
  drawBranch(cssW*.58,groundY,trunkLen,-Math.PI/2,trunkWidth,depth,1,p,sway);
}

function doPinchAction(){
  if(generation<0){
    generation=0;
    message.textContent='TRUNK CREATED — PINCH AGAIN TO GROW';
  }else if(generation<maxGeneration){
    generation++;
    message.textContent=`GROW — GENERATION ${generation}`;
  }else{
    message.textContent='MAX GENERATION';
  }
  draw();
}

function updateLabels(){
  outputs.angle.value=controls.angle.value+'°';
  outputs.length.value=controls.length.value+'%';
  outputs.width.value=controls.width.value+'%';
  outputs.variation.value=controls.variation.value+'%';
  draw();
}
Object.values(controls).forEach(el=>el.addEventListener('input',updateLabels));

function drawHands(hands){
  const r=overlay.getBoundingClientRect();
  octx.clearRect(0,0,r.width,r.height);
  if(!hands?.length)return;
  const chains=[
    [0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],
    [0,13,14,15,16],[0,17,18,19,20],[5,9,13,17]
  ];
  for(const hand of hands){
    const lm=hand.landmarks;
    octx.strokeStyle='rgba(17,17,17,.62)';
    octx.lineWidth=1;
    for(const chain of chains){
      octx.beginPath();
      chain.forEach((id,k)=>{
        const p=lm[id];
        const x=(1-p.x)*r.width;
        const y=p.y*r.height;
        if(k===0)octx.moveTo(x,y);else octx.lineTo(x,y);
      });
      octx.stroke();
    }
    [4,8,12,16,20].forEach(id=>{
      const p=lm[id];
      octx.beginPath();
      octx.arc((1-p.x)*r.width,p.y*r.height,3,0,Math.PI*2);
      octx.fillStyle='#111';
      octx.fill();
    });
  }
}

async function setupHandLandmarker(){
  if(handLandmarker)return;
  handStatus.textContent='HAND: LOADING';

  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );

  handLandmarker=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numHands:2,
    minHandDetectionConfidence:.6,
    minHandPresenceConfidence:.6,
    minTrackingConfidence:.6
  });
}

async function startCamera(){
  try{
    await setupHandLandmarker();
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    cameraRunning=true;
    cameraStart.textContent='CAMERA ON';
    cameraStart.disabled=true;
    handStatus.textContent='HAND: SEARCHING';
    message.textContent=generation<0
      ? 'PINCH THUMB + INDEX TO CREATE THE FIRST TRUNK'
      : 'PINCH THUMB + INDEX TO GROW';
    requestAnimationFrame(predictLoop);
  }catch(err){
    console.error(err);
    handStatus.textContent='HAND: ERROR';
    message.textContent='CAMERA ERROR — HTTPS / CAMERA PERMISSION REQUIRED';
  }
}

function predictLoop(){
  if(!cameraRunning)return;

  const frameNow=performance.now();
  const dt=Math.min(50,frameNow-lastFrameTime);
  lastFrameTime=frameNow;
  windStrength+=(targetWindStrength-windStrength)*Math.min(1,dt*.008);
  windPhase+=dt*(.0022+windStrength*.0065);
  if(windActive && generation>=0)draw();

  if(video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;

    const now=performance.now();
    const results=handLandmarker.detectForVideo(video,now);
    const all=results.landmarks || [];

    if(all.length){
      const hands=all.map((lm,i)=>({
        landmarks:lm,
        label:handednessLabel(results,i),
        openness:handOpenness(lm)
      }));

      const left=hands.find(h=>h.label==='Left');
      const right=hands.find(h=>h.label==='Right');

      let bestPinchRatio=999;
      for(const h of hands){
        const lm=h.landmarks;
        const handScale=Math.max(.001,dist(lm[0],lm[9]));
        bestPinchRatio=Math.min(bestPinchRatio,dist(lm[4],lm[8])/handScale);
      }

      let isPinching=previousPinch;
      if(!previousPinch && bestPinchRatio<PINCH_ON)isPinching=true;
      if(previousPinch && bestPinchRatio>PINCH_OFF)isPinching=false;

      if(left && left.openness>.72){
        if(!leftOpenHoldStart)leftOpenHoldStart=now;
        if(!windActive && now-leftOpenHoldStart>LEFT_OPEN_HOLD_MS){
          windActive=true;
          message.textContent='WIND STARTED — OPEN / CLOSE RIGHT HAND TO CHANGE STRENGTH';
        }
      }else{
        leftOpenHoldStart=0;
      }

      if(windActive){
        targetWindStrength=right ? clamp((right.openness-.18)/.72,0,1) : 0;
      }else{
        targetWindStrength=0;
      }

      const leftTxt=left ? `L ${(left.openness*100).toFixed(0)}%` : 'L —';
      const rightTxt=right ? `R ${(right.openness*100).toFixed(0)}%` : 'R —';
      handStatus.textContent=`HAND: ${leftTxt} / ${rightTxt}`;
      windStatus.textContent=windActive
        ? `WIND: ${Math.round(windStrength*100)}%`
        : 'WIND: OFF';

      pinchIndicator.classList.toggle('on',isPinching);
      drawHands(hands);

      if(isPinching && !previousPinch && now-lastPinchTime>PINCH_COOLDOWN_MS){
        lastPinchTime=now;
        doPinchAction();
      }
      previousPinch=isPinching;
    }else{
      previousPinch=false;
      leftOpenHoldStart=0;
      if(windActive)targetWindStrength=0;
      handStatus.textContent='HAND: SEARCHING';
      windStatus.textContent=windActive ? `WIND: ${Math.round(windStrength*100)}%` : 'WIND: OFF';
      pinchIndicator.classList.remove('on');
      drawHands([]);
    }
  }
  requestAnimationFrame(predictLoop);
}

cameraStart.addEventListener('click',startCamera);

resetBtn.addEventListener('click',()=>{
  generation=-1;
  seed=Math.random()*100000;
  previousPinch=false;
  windActive=false;
  windStrength=0;
  targetWindStrength=0;
  leftOpenHoldStart=0;
  windStatus.textContent='WIND: OFF';
  message.textContent=cameraRunning
    ? 'PINCH THUMB + INDEX TO CREATE THE FIRST TRUNK'
    : 'CAMERA START → PINCH TO CREATE THE FIRST TRUNK';
  draw();
});

window.addEventListener('resize',resize,{passive:true});
resize();
</script>
</body>
</html>
